[package]
name = "pminer-pool"
version = "0.1.0"
edition = "2024"
description = "pminer: построение PlainProof (официальный код Pearl) и stratum-клиент пула"

[lib]
name = "pminer_pool"
crate-type = ["staticlib", "rlib"]

[dependencies]
zk-pow = { path = "../third_party/pearl/zk-pow" }
pearl-blake3 = { path = "../third_party/pearl/pearl-blake3", features = ["serde"] }
anyhow = "1"
bincode = "1.3.3"
base64 = "0.21"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1.0"
primitive-types = "0.12.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
panic = "unwind"
